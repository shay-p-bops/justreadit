<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Just Read It</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">J</div>
        <div>
          <h1>Just Read It</h1>
          <p>Instant or natural local speech</p>
        </div>
      </header>

      <section class="settings" aria-label="Voice settings">
        <label>
          Mode
          <select id="engine">
            <option value="system">Instant · system voice</option>
            <option value="kokoro">Natural · Kokoro</option>
          </select>
        </label>

        <label id="voice-setting">
          Natural voice
          <select id="voice">
            <option value="af_heart">Heart · US female</option>
            <option value="af_bella">Bella · US female</option>
            <option value="bf_emma">Emma · UK female</option>
            <option value="am_michael">Michael · US male</option>
            <option value="bm_george">George · UK male</option>
          </select>
        </label>

        <label>
          Speed <output id="speed-value" for="speed">1.0×</output>
          <input id="speed" type="range" min="0.75" max="1.35" step="0.05" value="1" />
        </label>

        <label>
          Volume <output id="volume-value" for="volume">100%</output>
          <input id="volume" type="range" min="0" max="1" step="0.05" value="1" />
        </label>
      </section>

      <section class="primary-actions" aria-label="Start reading">
        <button id="read-selection" class="primary">Read selection</button>
        <button id="read-page">Read page</button>
      </section>

      <section id="activity" class="activity" aria-live="polite" hidden>
        <span class="wave" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </span>
        <span id="activity-text">Generating audio</span>
      </section>

      <section id="timeline" class="timeline" aria-label="Playback progress">
        <div class="timeline-meta">
          <span id="elapsed-time">0:00</span>
          <span id="segment-text">Waiting for audio</span>
          <span id="remaining-time">—</span>
        </div>
        <input id="scrubber" type="range" min="0" max="1" step="0.1" value="0" aria-label="Seek through playback" disabled />
      </section>

      <section class="player" aria-label="Playback controls">
        <button id="pause" title="Pause" aria-label="Pause">Ⅱ</button>
        <button id="resume" title="Resume" aria-label="Resume">▶</button>
        <button id="stop" title="Stop" aria-label="Stop">■</button>
      </section>

      <div class="status" role="status" aria-live="polite">
        <span id="status-dot"></span>
        <span id="status-text">Ready</span>
        <span id="latency-text" class="latency" aria-hidden="true"></span>
      </div>

      <p class="note"><strong>Instant</strong> uses a local operating-system voice for the fastest start and approximate seeking. <strong>Natural</strong> uses Kokoro and may take longer to generate each audio part.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
